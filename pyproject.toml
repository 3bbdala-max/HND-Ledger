[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnd-ledger"
version = "0.2.0"
description = "Deterministic local ledger prototype for HND"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "cbor2>=5.6,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
