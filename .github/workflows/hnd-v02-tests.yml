name: HND v0.2 reference tests

on:
  push:
    branches:
      - phase-0.2-planning
  pull_request:
    branches:
      - main

jobs:
  hnd-v02-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install hash-verified isolated JCS spike dependency
        run: python -m pip install --require-hashes -r requirements-vsp-jcs-spike.txt
      - name: Install pinned independent JavaScript JCS comparator
        run: |
          mkdir -p "$RUNNER_TEMP/hnd-jcs-node"
          npm install --prefix "$RUNNER_TEMP/hnd-jcs-node" --no-save --ignore-scripts --no-audit --no-fund canonicalize@2.1.0
          echo "HND_JCS_NODE_MODULES=$RUNNER_TEMP/hnd-jcs-node/node_modules" >> "$GITHUB_ENV"
      - name: Generate pinned CometBFT v0.40.0 Python bindings
        run: bash scripts/generate_cometbft_v040_python.sh
      - name: Run isolated VSP JCS cross-language compatibility spike
        run: python -m unittest -v tests.test_vsp_jcs_compatibility_spike
      - name: Run isolated v0.2 tests
        run: >-
          python -m unittest -v
          tests.test_v02_transaction_envelope
          tests.test_v02_genesis_manifest
          tests.test_v02_ledger
          tests.test_v02_blocks
          tests.test_v02_abci_app
          tests.test_v02_cometbft_v040_adapter
          tests.test_v02_four_abci_replica_evidence
          tests.test_v02_four_replica_state_convergence
          tests.test_v02_tcp_peer_relay
          tests.test_v02_anti_rollback_reference
          tests.test_v02_recovery_controls

  cometbft-single-node-smoke:
    needs: hnd-v02-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out HND
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Go for CometBFT v0.40.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.0"
      - name: Install HND Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate pinned ABCI bindings
        run: bash scripts/generate_cometbft_v040_python.sh
      - name: Build pinned CometBFT binary
        run: |
          git init --quiet "$RUNNER_TEMP/cometbft-src"
          git -C "$RUNNER_TEMP/cometbft-src" remote add origin https://github.com/cometbft/cometbft.git
          git -C "$RUNNER_TEMP/cometbft-src" fetch --quiet --depth 1 origin 0880b4d378f347ab16e54ec677ff50d803f37d62
          git -C "$RUNNER_TEMP/cometbft-src" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cometbft-src" rev-parse HEAD)" = "0880b4d378f347ab16e54ec677ff50d803f37d62"
          cd "$RUNNER_TEMP/cometbft-src"
          go build -o "$RUNNER_TEMP/cometbft" ./cmd/cometbft
          go build -o "$RUNNER_TEMP/hnd-cometbft-remote-only" "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_only_main.go"
          "$RUNNER_TEMP/hnd-cometbft-remote-only" start --help >/dev/null
      - name: Prove remote-only CLI rejects missing signer without generating local consensus keys
        run: |
          home="$RUNNER_TEMP/hnd-remote-only-negative"
          "$RUNNER_TEMP/cometbft" init --home "$home"
          rm -f "$home/config/priv_validator_key.json" "$home/data/priv_validator_state.json"
          if "$RUNNER_TEMP/hnd-cometbft-remote-only" node --home "$home" >"$RUNNER_TEMP/remote-only-negative.log" 2>&1; then
            echo "remote-only CLI unexpectedly started without an external signer" >&2
            exit 1
          fi
          grep -q "HND remote-only node requires priv_validator_laddr" "$RUNNER_TEMP/remote-only-negative.log"
          test ! -e "$home/config/priv_validator_key.json"
          test ! -e "$home/data/priv_validator_state.json"
          if "$RUNNER_TEMP/hnd-cometbft-remote-only" init --home "$home" >/dev/null 2>&1; then
            echo "remote-only CLI unexpectedly exposes key-generating init command" >&2
            exit 1
          fi
          if "$RUNNER_TEMP/hnd-cometbft-remote-only" gen-validator --home "$home" >/dev/null 2>&1; then
            echo "remote-only CLI unexpectedly exposes validator-key generation command" >&2
            exit 1
          fi
          test ! -e "$home/config/priv_validator_key.json"
          test ! -e "$home/data/priv_validator_state.json"
      - name: Run pinned CometBFT Byzantine prevote equivocation and evidence regression
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go test ./consensus -run '^TestByzantinePrevoteEquivocation$' -count=1 -v
      - name: Run HND four-replica P2P equivocation evidence integration
        run: python scripts/cometbft_v040_hnd_p2p_evidence_integration.py --cometbft-source "$RUNNER_TEMP/cometbft-src"
      - name: Run pinned CometBFT validator signer anti-double-sign smoke test
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_privval_signing_smoke.go"
      - name: Run pinned CometBFT remote signer protocol conformance probe
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_signer_protocol_probe.go"
      - name: Run process-isolated pinned CometBFT remote signer probe
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_signer_process_probe.go"
      - name: Reproduce shared FilePV multi-process dual-sign risk (expected unsafe behavior)
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_signer_process_probe.go" --shared-filepv-dual-writer-probe
      - name: Run authenticated Noise remote-signer integration and unauthorized-peer rejection probe
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_noise_remote_signer_probe.go"
      - name: Run connected remote signer vote-withholding probe
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_signer_process_probe.go" --withholding-probe
      - name: Run remote signer anti-double-sign persistence across restart
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go run "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_signer_process_probe.go" --remote-anti-double-sign-probe
      - name: Build pinned persistent remote signer helper
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go build -o "$RUNNER_TEMP/hnd-remote-signer" "$GITHUB_WORKSPACE/scripts/cometbft_v040_remote_signer_process_probe.go"
      - name: Reject missing anti-double-sign state in recovery mode
        run: |
          "$RUNNER_TEMP/hnd-remote-signer" --missing-state-recovery-probe
      - name: Reject substituted remote signer anti-double-sign state during recovery
        run: |
          "$RUNNER_TEMP/hnd-remote-signer" --state-digest-mismatch-probe
      - name: Run single-node ABCI integration smoke test
        run: python scripts/cometbft_v040_single_node_smoke.py --binary "$RUNNER_TEMP/cometbft" --cometbft-source "$RUNNER_TEMP/cometbft-src"
      - name: Run four-validator Genesis and identity preflight
        run: python scripts/cometbft_v040_four_validator_genesis_preflight.py --binary "$RUNNER_TEMP/cometbft" --cometbft-source "$RUNNER_TEMP/cometbft-src"
      - name: Run private four-validator network integration smoke test
        run: python scripts/cometbft_v040_four_validator_network_smoke.py --binary "$RUNNER_TEMP/cometbft" --cometbft-source "$RUNNER_TEMP/cometbft-src"
      - name: Run four-validator external remote-signer integration and outage recovery
        run: python scripts/cometbft_v040_four_validator_network_smoke.py --binary "$RUNNER_TEMP/cometbft" --cometbft-source "$RUNNER_TEMP/cometbft-src" --remote-signer-binary "$RUNNER_TEMP/hnd-remote-signer" --remote-only-binary "$RUNNER_TEMP/hnd-cometbft-remote-only"
      - name: Build pinned Noise remote signer helper
        run: |
          cd "$RUNNER_TEMP/cometbft-src"
          go build -o "$RUNNER_TEMP/hnd-noise-remote-signer" "$GITHUB_WORKSPACE/scripts/cometbft_v040_noise_remote_signer_helper.go"
      - name: Reject missing Noise anti-double-sign state in recovery mode
        run: |
          "$RUNNER_TEMP/hnd-noise-remote-signer" --missing-state-recovery-probe
      - name: Reject substituted Noise anti-double-sign state during recovery
        run: |
          "$RUNNER_TEMP/hnd-noise-remote-signer" --state-digest-mismatch-probe
      - name: Run four-validator authenticated Noise remote-signer integration and recovery
        run: python scripts/cometbft_v040_four_validator_network_smoke.py --binary "$RUNNER_TEMP/cometbft" --cometbft-source "$RUNNER_TEMP/cometbft-src" --noise-remote-signer-binary "$RUNNER_TEMP/hnd-noise-remote-signer" --remote-only-binary "$RUNNER_TEMP/hnd-cometbft-remote-only"
