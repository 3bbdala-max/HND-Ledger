name: Station 2 witnessed activation coordinator tests

on:
  push:
    branches:
      - feat/station2-etcd-atomic-activation-backend

permissions:
  contents: read

jobs:
  witnessed-activation-coordinator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install hash-verified JCS dependency required by activation evidence verifier
        run: python -m pip install --require-hashes -r requirements-vsp-jcs-spike.txt
      - name: Run witnessed etcd activation coordinator recovery tests
        run: python -m unittest -v tests.test_witnessed_etcd_activation_coordinator
      - name: Run lost etcd transaction response reconciliation tests
        run: python -m unittest -v tests.test_witnessed_etcd_atomic_commit_recovery
