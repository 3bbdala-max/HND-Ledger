name: CometBFT four-validator liveness and recovery

on:
  push:
    branches:
      - implementation/v0.2-local-ledger
  pull_request:
    branches:
      - implementation/v0.2-local-ledger

jobs:
  four-validator-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: |
            abci-adapter/go.sum
            abci-adapter/go.mod
      - name: Install HND Python application
        run: python -m pip install -e .
      - name: Install pinned CometBFT node
        run: go install github.com/cometbft/cometbft/cmd/cometbft@v0.40.0
      - name: Build HND ABCI socket adapter
        run: |
          cd abci-adapter
          go mod tidy
          go build -o "$RUNNER_TEMP/hnd-abci" ./cmd/hnd-abci
      - name: Generate four-validator test network
        shell: bash
        run: |
          set -euo pipefail
          cometbft testnet --v 4 --o "$RUNNER_TEMP/hnd-four-net" --populate-persistent-peers=false
          python - "$RUNNER_TEMP/hnd-four-net" <<'PY'
          import base64, json, pathlib, re, subprocess, sys
          import cbor2
          root = pathlib.Path(sys.argv[1])
          data_root = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "hnd-four-data"
          data_root.mkdir(parents=True, exist_ok=True)
          # Empty, capped development genesis; no keys or balances are issued.
          raw = cbor2.dumps([2, 1_000_000, []], canonical=True)
          app_state = {"payload": base64.b64encode(raw).decode("ascii"), "version": 2}
          ids = []
          for i in range(4):
              node = root / f"node{i}"
              ids.append(subprocess.run(
                  ["cometbft", "show-node-id", "--home", str(node)],
                  check=True, capture_output=True, text=True,
              ).stdout.strip())
          def set_key(text, section, key, value, quoted=True):
              pattern = rf"(?ms)(\[{re.escape(section)}\]\n)(.*?)(?=^\[|\Z)"
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"missing TOML section [{section}]")
              body = match.group(2)
              line = re.compile(rf"(?m)^{re.escape(key)}\s*=.*$")
              replacement = f'{key} = "{value}"' if quoted else f"{key} = {value}"
              body = line.sub(replacement, body, count=1) if line.search(body) else body + replacement + "\n"
              return text[:match.start(2)] + body + text[match.end(2):]
          for i in range(4):
              node = root / f"node{i}"
              cfg = node / "config" / "config.toml"
              text = cfg.read_text()
              text = re.sub(r'(?m)^proxy_app\s*=.*$', f'proxy_app = "tcp://127.0.0.1:{28658+i}"', text, count=1)
              text = set_key(text, "rpc", "laddr", f"tcp://127.0.0.1:{26657+i}")
              text = set_key(text, "p2p", "laddr", f"tcp://127.0.0.1:{27656+i}")
              text = set_key(text, "p2p", "allow_duplicate_ip", "true", quoted=False)
              peers = ",".join(f"{ids[j]}@127.0.0.1:{27656+j}" for j in range(4) if j != i)
              text = set_key(text, "p2p", "persistent_peers", peers)
              cfg.write_text(text)
              genesis = node / "config" / "genesis.json"
              data = json.loads(genesis.read_text())
              data["chain_id"] = "HND-LOCAL-V2"
              data["app_state"] = app_state
              genesis.write_text(json.dumps(data, separators=(",", ":")))
          print("Configured four validators with distinct RPC, P2P, ABCI, SQLite, and IPC endpoints.")
          PY
      - name: Verify quorum continues during validator outage and restart catches up
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/hnd-four-net"
          DATA="$RUNNER_TEMP/hnd-four-data"
          mkdir -p "$DATA"
          # Give validator 0 a dedicated OS identity so its P2P traffic can be
          # isolated without dropping traffic among validators 1, 2, and 3.
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin hnd-validator0
          sudo chmod o+x /home/runner /home/runner/work /home/runner/work/_temp "$ROOT"
          sudo chown -R hnd-validator0 "$ROOT/node0"
          VALIDATOR0_UID=$(id -u hnd-validator0)
          declare -a PY_PIDS GO_PIDS NODE_PIDS
          cleanup() {
            sudo pkill -TERM -u "$VALIDATOR0_UID" -x cometbft 2>/dev/null || true
            for pid in "${NODE_PIDS[@]:-}" "${GO_PIDS[@]:-}" "${PY_PIDS[@]:-}"; do
              [[ -n "$pid" ]] && kill "$pid" 2>/dev/null || true
            done
            for pid in "${NODE_PIDS[@]:-}" "${GO_PIDS[@]:-}" "${PY_PIDS[@]:-}"; do
              [[ -n "$pid" ]] && wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          start_node() {
            local i="$1"
            local socket="$DATA/python-$i.sock"
            init_args=()
            if [[ ! -e "$DATA/ledger-$i.sqlite" ]]; then init_args+=(--init-empty-dev-genesis); fi
            hnd-abci-python --chain-db "$DATA/ledger-$i.sqlite" --socket "$socket" ${init_args[@]} >"$DATA/python-$i.log" 2>&1 &
            PY_PIDS[$i]=$!
            for _ in $(seq 1 30); do
              [[ -S "$socket" ]] && break
              kill -0 "${PY_PIDS[$i]}" 2>/dev/null || { cat "$DATA/python-$i.log"; return 1; }
              sleep 1
            done
            [[ -S "$socket" ]]
            HND_IPC_SOCKET="$socket" HND_ABCI_LISTEN="tcp://127.0.0.1:$((28658+i))" \
              "$RUNNER_TEMP/hnd-abci" >"$DATA/adapter-$i.log" 2>&1 &
            GO_PIDS[$i]=$!
            sleep 1
            kill -0 "${GO_PIDS[$i]}"
            if [[ "$i" -eq 0 ]]; then
              # sudo resets PATH on the hosted runner; resolve the pinned
              # Go-installed binary before changing user and pass its absolute path.
              local cometbft_bin
              cometbft_bin="$(command -v cometbft)"
              sudo install -m 0755 "$cometbft_bin" /usr/local/bin/hnd-cometbft
              sudo -u hnd-validator0 /usr/local/bin/hnd-cometbft start --home "$ROOT/node$i" >"$DATA/node-$i.log" 2>&1 &
            else
              cometbft start --home "$ROOT/node$i" >"$DATA/node-$i.log" 2>&1 &
            fi
            NODE_PIDS[$i]=$!
          }
          for i in 0 1 2 3; do start_node "$i"; done

          ready=false
          for _ in $(seq 1 180); do
            count=0
            for i in 0 1 2 3; do
              if curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$DATA/status-$i.json"; then
                h=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/status-$i.json")
                [[ "$h" -ge 3 ]] && count=$((count+1))
              fi
            done
            if [[ "$count" -eq 4 ]]; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]] || {
            echo "Four validators did not reach startup height; diagnostic logs follow"
            for i in 0 1 2 3; do
              echo "===== validator $i Python engine ====="
              cat "$DATA/python-$i.log" || true
              echo "===== validator $i Go ABCI adapter ====="
              cat "$DATA/adapter-$i.log" || true
              echo "===== validator $i CometBFT node ====="
              cat "$DATA/node-$i.log" || true
              echo "===== validator $i RPC status ====="
              cat "$DATA/status-$i.json" || true
            done
            exit 1
          }

          # Prove the full P2P mesh exists before any isolation rule is applied.
          for i in 0 1 2 3; do
            curl --silent --fail "http://127.0.0.1:$((26657+i))/net_info" -o "$DATA/net-before-$i.json"
            peers=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["n_peers"]))' "$DATA/net-before-$i.json")
            echo "Validator $i connected P2P peers before partition: $peers"
            [[ "$peers" -ge 3 ]] || { echo "Validator $i did not establish all three expected P2P peers"; exit 1; }
          done

          baseline=0
          for i in 1 2 3; do
            curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$DATA/before-$i.json"
            h=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/before-$i.json")
            (( h > baseline )) && baseline=$h
          done
          echo "Stopping validator 0 at peer height $baseline"
          sudo pkill -TERM -u "$VALIDATOR0_UID" -x cometbft 2>/dev/null || true
          kill "${NODE_PIDS[0]}" "${GO_PIDS[0]}" "${PY_PIDS[0]}"
          wait "${NODE_PIDS[0]}" "${GO_PIDS[0]}" "${PY_PIDS[0]}" 2>/dev/null || true
          rm -f "$DATA/python-0.sock"
          unset 'NODE_PIDS[0]' 'GO_PIDS[0]' 'PY_PIDS[0]'

          target=$((baseline + 2))
          quorum_progress=false
          for _ in $(seq 1 120); do
            count=0
            for i in 1 2 3; do
              if curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$DATA/offline-$i.json"; then
                h=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/offline-$i.json")
                [[ "$h" -ge "$target" ]] && count=$((count+1))
              fi
            done
            if [[ "$count" -eq 3 ]]; then quorum_progress=true; break; fi
            sleep 1
          done
          [[ "$quorum_progress" == true ]] || {
            echo "The remaining three validators failed to advance by two blocks during validator-0 outage"
            for i in 1 2 3; do cat "$DATA/node-$i.log" || true; done
            exit 1
          }
          if curl --silent --fail http://127.0.0.1:26657/status -o "$DATA/unexpected-node0.json"; then
            echo "Validator 0 unexpectedly remained available after stop"
            exit 1
          fi
          echo "Quorum liveness confirmed: validators 1, 2, and 3 advanced to at least $target while validator 0 was offline."

          start_node 0
          recovered=false
          for _ in $(seq 1 180); do
            count=0
            min_peer=999999999
            for i in 1 2 3; do
              if curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$DATA/peer-$i.json"; then
                h=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/peer-$i.json")
                (( h < min_peer )) && min_peer=$h
              fi
            done
            if curl --silent --fail http://127.0.0.1:26657/status -o "$DATA/recovered-0.json"; then
              h0=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/recovered-0.json")
              if [[ "$h0" -ge "$min_peer" && "$h0" -ge "$target" ]]; then recovered=true; break; fi
            fi
            sleep 1
          done
          [[ "$recovered" == true ]] || {
            echo "Validator 0 did not catch up to the active quorum"
            cat "$DATA/python-0.log" "$DATA/adapter-0.log" "$DATA/node-0.log" || true
            exit 1
          }

          # Isolate a live validator at the TCP/P2P layer without stopping its processes.
          partition_baseline=0
          for i in 1 2 3; do
            curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$DATA/partition-before-$i.json"
            h=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/partition-before-$i.json")
            (( h > partition_baseline )) && partition_baseline=$h
          done
          partition_target=$((partition_baseline + 5))
          echo "Partitioning validator 0 at height $partition_baseline; target for remaining quorum: $partition_target"
          # Block both directions of validator 0's P2P links. Its inbound
          # listener is unique (27656); the outbound rule is scoped to its UID.
          sudo iptables -I OUTPUT 1 -p tcp --dport 27657:27659 -m owner --uid-owner "$VALIDATOR0_UID" -j DROP
          sudo iptables -I INPUT 1 -p tcp --dport 27656 -j DROP
          # Close established outbound and inbound TCP sessions; otherwise
          # CometBFT can retain peer objects on already-open connections.
          validator0_pids=$(pgrep -u "$VALIDATOR0_UID" || true)
          [[ -n "$validator0_pids" ]] || { echo "No validator-0 process found for socket isolation"; exit 1; }
          printf 'Validator 0 process IDs: %s\n' "$validator0_pids"
          printf '%s\n' "$validator0_pids" > "$DATA/validator0-pids.txt"
          python - "$DATA/validator0-pids.txt" <<'PY'
          import pathlib, re, subprocess, sys
          pids = {int(value) for value in pathlib.Path(sys.argv[1]).read_text().split()}
          output = subprocess.run(["sudo", "ss", "-tnp"], check=True, capture_output=True, text=True).stdout
          matched = 0
          for line in output.splitlines():
              if "ESTAB" not in line:
                  continue
              owners = {int(value) for value in re.findall(r"pid=(\d+)", line)}
              if not (owners & pids):
                  continue
              endpoints = re.findall(r"127\.0\.0\.1:(\d+)", line)
              if len(endpoints) != 2:
                  continue
              local_port, remote_port = map(int, endpoints)
              if remote_port not in (27657, 27658, 27659):
                  continue
              matched += 1
              result = subprocess.run([
                  "sudo", "ss", "-K", "src", "127.0.0.1",
                  "sport", "=", f":{local_port}", "dst", "127.0.0.1",
                  "dport", "=", f":{remote_port}",
              ], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f"Failed to close validator-0 socket {local_port}->{remote_port}: {result.stderr}")
          print(f"Matched and issued close for {matched} validator-0 established P2P TCP sockets.")
          if matched == 0:
              raise SystemExit("No validator-0 established P2P sockets were found to isolate")
          PY
          # Close the accepted side of all existing connections to validator 0.
          sudo ss -K src 127.0.0.1 sport = :27656 || true
          sudo iptables -vnL INPUT
          sudo iptables -vnL OUTPUT
          partitioned=true
          remove_partition() {
            sudo iptables -D OUTPUT -p tcp --dport 27657:27659 -m owner --uid-owner "$VALIDATOR0_UID" -j DROP 2>/dev/null || true
            sudo iptables -D INPUT -p tcp --dport 27656 -j DROP 2>/dev/null || true
            partitioned=false
          }
          trap 'if [[ "$partitioned" == true ]]; then remove_partition; fi; cleanup' EXIT

          partition_progress=false
          for _ in $(seq 1 120); do
            count=0
            for i in 1 2 3; do
              if curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$DATA/partition-active-$i.json"; then
                h=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/partition-active-$i.json")
                [[ "$h" -ge "$partition_target" ]] && count=$((count+1))
              fi
            done
            if [[ "$count" -eq 3 ]]; then partition_progress=true; break; fi
            sleep 1
          done
          echo "Firewall counters after partition window:"
          sudo iptables -vnxL INPUT
          sudo iptables -nvxL OUTPUT
          output_drops=$(sudo iptables -nvxL OUTPUT | grep -F "owner UID match $VALIDATOR0_UID" | awk 'NR==1 {print $1}')
          input_drops=$(sudo iptables -nvxL INPUT | awk '/dpt:27656/ {print $1; exit}')
          echo "Validator-0 outbound P2P drops: ${output_drops:-0}"
          echo "Validator-0 inbound P2P drops: ${input_drops:-0}"
          [[ "${input_drops:-0}" -gt 0 ]] || {
            echo "Firewall did not demonstrably drop inbound P2P traffic to validator 0"
            exit 1
          }
          [[ "${output_drops:-0}" -gt 0 ]] || {
            echo "Firewall did not demonstrably drop validator-0 outbound P2P traffic"
            exit 1
          }
          for i in 0 1 2 3; do
            echo "===== validator $i P2P peers ====="
            curl --silent --show-error "http://127.0.0.1:$((26657+i))/net_info" || true
            echo
          done
          echo "===== TCP sockets ====="
          ss -tnp || true
          isolated_peers=999
          for _ in $(seq 1 60); do
            isolated_peers=$(curl --silent --fail http://127.0.0.1:26657/net_info | python -c 'import json,sys; print(int(json.load(sys.stdin)["result"]["n_peers"]))')
            [[ "$isolated_peers" -eq 0 ]] && break
            sleep 1
          done
          for i in 1 2 3; do
            peers=$(curl --silent --fail "http://127.0.0.1:$((26657+i))/net_info" | python -c 'import json,sys; print(int(json.load(sys.stdin)["result"]["n_peers"]))')
            echo "Validator $i peers during partition: $peers"
            [[ "$peers" -ge 2 ]] || { echo "Remaining quorum validator $i lost its two peers; partition rules are too broad"; exit 1; }
          done
          isolated_peers=$(curl --silent --fail http://127.0.0.1:26657/net_info | python -c 'import json,sys; print(int(json.load(sys.stdin)["result"]["n_peers"]))')
          echo "Validator 0 peers during partition: $isolated_peers"
          [[ "$isolated_peers" -eq 0 ]] || { echo "Validator 0 retained P2P peers during isolation"; exit 1; }
          [[ "$partition_progress" == true ]] || { echo "Remaining quorum did not advance during live network partition"; exit 1; }
          curl --silent --fail http://127.0.0.1:26657/status -o "$DATA/partition-isolated-0.json"
          isolated_height=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/partition-isolated-0.json")
          [[ "$isolated_height" -lt "$partition_target" ]] || {
            echo "Validator 0 advanced despite partition rules; isolation was not demonstrated"
            exit 1
          }
          echo "PASS: active quorum reached $partition_target while live isolated validator 0 remained at $isolated_height."

          remove_partition
          healed=false
          for _ in $(seq 1 180); do
            curl --silent --fail http://127.0.0.1:26657/status -o "$DATA/healed-0.json" || { sleep 1; continue; }
            h0=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$DATA/healed-0.json")
            if [[ "$h0" -ge "$partition_target" ]]; then healed=true; break; fi
            sleep 1
          done
          [[ "$healed" == true ]] || {
            echo "Validator 0 failed to catch up after network partition healed"
            cat "$DATA/node-0.log" || true
            exit 1
          }
          echo "PASS: validator 0 caught up after network partition healing."

          common_height=$((partition_target))
          for i in 0 1 2 3; do
            for _ in $(seq 1 60); do
              if curl --silent --fail "http://127.0.0.1:$((26657+i))/commit?height=$common_height" -o "$DATA/commit-$i.json"; then break; fi
              sleep 1
            done
            [[ -s "$DATA/commit-$i.json" ]] || { echo "Missing commit response for validator $i"; exit 1; }
          done
          python - "$DATA" "$common_height" <<'PY'
          import json, pathlib, sys
          root, height = pathlib.Path(sys.argv[1]), int(sys.argv[2])
          hashes = []
          for i in range(4):
              data = json.loads((root / f"commit-{i}.json").read_text())
              header = data["result"]["signed_header"]["header"]
              if int(header["height"]) != height:
                  raise SystemExit(f"validator {i} returned height {header['height']} not {height}")
              hashes.append(header["app_hash"])
          if len(set(hashes)) != 1:
              raise SystemExit(f"app hash mismatch after catch-up: {hashes}")
          print(f"PASS: all four validators agree on app_hash at height {height}: {hashes[0]}")
          PY
