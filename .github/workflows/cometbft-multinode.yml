name: CometBFT three-validator smoke

on:
  push:
    branches:
      - implementation/v0.2-local-ledger
  pull_request:
    branches:
      - implementation/v0.2-local-ledger

jobs:
  three-validators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: |
            abci-adapter/go.sum
            abci-adapter/go.mod

      - name: Install HND Python application
        run: python -m pip install -e .

      - name: Install pinned CometBFT node
        run: go install github.com/cometbft/cometbft/cmd/cometbft@v0.40.0

      - name: Build HND ABCI socket adapter
        run: |
          cd abci-adapter
          go mod tidy
          go build -o "$RUNNER_TEMP/hnd-abci" ./cmd/hnd-abci

      - name: Generate and configure three independent validators
        shell: bash
        run: |
          set -euo pipefail
          cometbft testnet --v 3 --o "$RUNNER_TEMP/hnd-net" --populate-persistent-peers=false
          python - "$RUNNER_TEMP/hnd-net" <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import cbor2
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from hnd_ledger.protocol import account_id

          root = pathlib.Path(sys.argv[1])
          data_root = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "hnd-data"
          data_root.mkdir(parents=True, exist_ok=True)

          # Deterministic test-only genesis key. The seed stays in the CI runner
          # and is never placed in CometBFT genesis or committed to the repo.
          alice_seed = hashlib.sha256(b"HND-LOCAL-V2 three-validator integration Alice").digest()
          alice_key = Ed25519PrivateKey.from_private_bytes(alice_seed)
          alice_public = alice_key.public_key().public_bytes(
              serialization.Encoding.Raw, serialization.PublicFormat.Raw
          )
          alice_id = account_id(alice_public)
          (data_root / "alice.seed").write_bytes(alice_seed)
          (data_root / "alice.seed").chmod(0o600)
          genesis_cbor = cbor2.dumps(
              [2, 1_000_000, [[alice_id, 1_000_000]]], canonical=True
          )
          # CometBFT app_state is JSON raw data, not arbitrary CBOR bytes.
          genesis_app_state = json.dumps(
              {"version": 2, "payload": base64.b64encode(genesis_cbor).decode("ascii")},
              sort_keys=True, separators=(",", ":"),
          )
          ids = []
          for i in range(3):
              node = root / f"node{i}"
              result = subprocess.run(
                  ["cometbft", "show-node-id", "--home", str(node)],
                  check=True, capture_output=True, text=True,
              )
              ids.append(result.stdout.strip())

          def set_key(text, section, key, value, *, quoted=True):
              pattern = rf"(?ms)(\[{re.escape(section)}\]\n)(.*?)(?=^\[|\Z)"
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"missing TOML section [{section}]")
              body = match.group(2)
              line = re.compile(rf"(?m)^{re.escape(key)}\s*=.*$")
              replacement = f'{key} = "{value}"' if quoted else f"{key} = {value}"
              if line.search(body):
                  body = line.sub(replacement, body, count=1)
              else:
                  body += replacement + "\n"
              return text[:match.start(2)] + body + text[match.end(2):]

          for i in range(3):
              node = root / f"node{i}"
              cfg = node / "config" / "config.toml"
              text = cfg.read_text()
              text = re.sub(r'(?m)^proxy_app\s*=.*$', f'proxy_app = "tcp://127.0.0.1:{28658+i}"', text, count=1)
              text = set_key(text, "rpc", "laddr", f"tcp://127.0.0.1:{26657+i}")
              text = set_key(text, "p2p", "laddr", f"tcp://127.0.0.1:{27656+i}")
              text = set_key(text, "p2p", "allow_duplicate_ip", "true", quoted=False)
              peers = ",".join(
                  f"{ids[j]}@127.0.0.1:{27656+j}" for j in range(3) if j != i
              )
              text = set_key(text, "p2p", "persistent_peers", peers)
              cfg.write_text(text)

              genesis = node / "config" / "genesis.json"
              data = json.loads(genesis.read_text())
              data["chain_id"] = "HND-LOCAL-V2"
              data["app_state"] = json.loads(genesis_app_state)
              genesis.write_text(json.dumps(data, separators=(",", ":")))

          print("Configured three validators with separate RPC, P2P, ABCI, DB, and IPC endpoints.")
          PY

      - name: Run three validators and compare committed application hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/hnd-net"
          mkdir -p "$RUNNER_TEMP/hnd-data"
          PIDS=()

          cleanup() {
            for pid in "${PIDS[@]:-}"; do kill "$pid" 2>/dev/null || true; done
            for pid in "${PIDS[@]:-}"; do wait "$pid" 2>/dev/null || true; done
          }
          trap cleanup EXIT

          for i in 0 1 2; do
            SOCKET="$RUNNER_TEMP/hnd-data/python-$i.sock"
            DB="$RUNNER_TEMP/hnd-data/ledger-$i.sqlite"
            PY_LOG="$RUNNER_TEMP/hnd-data/python-$i.log"
            GO_LOG="$RUNNER_TEMP/hnd-data/adapter-$i.log"
            NODE_LOG="$RUNNER_TEMP/hnd-data/node-$i.log"

            hnd-abci-python --chain-db "$DB" --socket "$SOCKET" --init-empty-dev-genesis >"$PY_LOG" 2>&1 &
            PY_PID=$!
            PIDS+=("$PY_PID")
            for _ in $(seq 1 30); do
              [[ -S "$SOCKET" ]] && break
              kill -0 "$PY_PID" 2>/dev/null || { cat "$PY_LOG"; exit 1; }
              sleep 1
            done
            [[ -S "$SOCKET" ]]

            HND_IPC_SOCKET="$SOCKET" HND_ABCI_LISTEN="tcp://127.0.0.1:$((28658+i))" \
              "$RUNNER_TEMP/hnd-abci" >"$GO_LOG" 2>&1 &
            GO_PID=$!
            PIDS+=("$GO_PID")
            sleep 1
            kill -0 "$GO_PID"

            cometbft start --home "$ROOT/node$i" >"$NODE_LOG" 2>&1 &
            NODE_PID=$!
            PIDS+=("$NODE_PID")
          done

          ready=0
          for _ in $(seq 1 180); do
            ready=0
            for i in 0 1 2; do
              if curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$RUNNER_TEMP/status-$i.json"; then
                height=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$RUNNER_TEMP/status-$i.json")
                [[ "$height" -ge 3 ]] && ready=$((ready+1))
              fi
            done
            if [[ "$ready" -eq 3 ]]; then
              echo "All three validators reached at least height 3"
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 3 ]]; then
            echo "Only $ready validators reached height 3 before the startup deadline"
            for i in 0 1 2; do
              echo "===== validator $i: Python ABCI ====="
              cat "$RUNNER_TEMP/hnd-data/python-$i.log" || true
              echo "===== validator $i: Go adapter ====="
              cat "$RUNNER_TEMP/hnd-data/adapter-$i.log" || true
              echo "===== validator $i: CometBFT ====="
              cat "$RUNNER_TEMP/hnd-data/node-$i.log" || true
            done
            exit 1
          fi

          # Submit a real Ed25519-signed transfer through CometBFT RPC.
          python - "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import urllib.request
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from hnd_ledger.protocol import account_id, create_transaction, encode_transaction

          root = pathlib.Path(sys.argv[1])
          seed = (root / "hnd-data" / "alice.seed").read_bytes()
          alice = Ed25519PrivateKey.from_private_bytes(seed)
          bob_seed = hashlib.sha256(b"HND-LOCAL-V2 integration Bob").digest()
          bob = Ed25519PrivateKey.from_private_bytes(bob_seed)
          bob_public = bob.public_key().public_bytes_raw()
          bob_id = account_id(bob_public)
          tx = create_transaction(alice, bob_id, 250_000, 0)
          raw = encode_transaction(tx)
          url = "http://127.0.0.1:26657/broadcast_tx_commit?tx=0x" + raw.hex()
          with urllib.request.urlopen(url, timeout=45) as response:
              result = json.loads(response.read())["result"]
          check = result["check_tx"]["code"]
          delivered = result.get("tx_result", result.get("deliver_tx", {}))
          if check != 0 or delivered.get("code") != 0:
              raise SystemExit(f"transfer rejected: check_tx={result.get('check_tx')} tx_result={delivered}")
          height = int(result["height"])
          (root / "hnd-data" / "transfer.json").write_text(json.dumps({
              "height": height, "alice": account_id(alice.public_key().public_bytes_raw()).hex(),
              "bob": bob_id.hex(), "amount": 250_000, "raw": raw.hex(),
          }))
          print(f"Committed signed HND test transfer at height {height}")
          PY

          tx_height=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["height"])' "$RUNNER_TEMP/hnd-data/transfer.json")
          for _ in $(seq 1 120); do
            ready=0
            for i in 0 1 2; do
              curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$RUNNER_TEMP/tx-status-$i.json" || continue
              height=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$RUNNER_TEMP/tx-status-$i.json")
              [[ "$height" -ge "$tx_height" ]] && ready=$((ready+1))
            done
            [[ "$ready" -eq 3 ]] && break
            sleep 1
          done

          python - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import sys
          from hnd_ledger.chain import LocalChain, state_commitment

          root = pathlib.Path(sys.argv[1])
          meta = json.loads((root / "hnd-data" / "transfer.json").read_text())
          alice, bob, amount = bytes.fromhex(meta["alice"]), bytes.fromhex(meta["bob"]), meta["amount"]
          hashes = []
          for i in range(3):
              db_path = root / "hnd-data" / f"ledger-{i}.sqlite"
              chain = LocalChain(db_path)
              try:
                  if chain.height < meta["height"]:
                      raise SystemExit(f"validator {i} has not committed transfer height")
                  if chain.blocks[meta["height"] - 1].transactions.count(bytes.fromhex(meta["raw"])) != 1:
                      raise SystemExit(f"validator {i} did not commit exactly one copy of the transfer")
                  if chain.state.balances.get(alice) != 750_000:
                      raise SystemExit(f"validator {i} Alice balance mismatch: {chain.state.balances.get(alice)}")
                  if chain.state.balances.get(bob) != amount:
                      raise SystemExit(f"validator {i} Bob balance mismatch: {chain.state.balances.get(bob)}")
                  if chain.state.next_nonces.get(alice) != 1:
                      raise SystemExit(f"validator {i} Alice nonce mismatch")
                  hashes.append(state_commitment(chain.state))
              finally:
                  chain.close()
          if len(set(hashes)) != 1:
              raise SystemExit(f"post-transfer app hashes diverged: {hashes}")
          print(f"All validators committed the signed transfer at height {meta['height']}; balances, nonce, and app hash agree: {hashes[0].hex()}")
          PY

          for i in 0 1 2; do
            curl --silent --fail "http://127.0.0.1:$((26657+i))/status" -o "$RUNNER_TEMP/status-$i.json" || {
              cat "$RUNNER_TEMP/hnd-data/node-$i.log"; exit 1;
            }
            height=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$RUNNER_TEMP/status-$i.json")
            if [[ "$height" -lt 3 ]]; then
              echo "Validator $i did not reach height 3 (height=$height)"
              for j in 0 1 2; do cat "$RUNNER_TEMP/hnd-data/node-$j.log"; done
              exit 1
            fi
            curl --silent --fail "http://127.0.0.1:$((26657+i))/commit?height=2" -o "$RUNNER_TEMP/commit-$i.json"
          done

          python - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          hashes = []
          heights = []
          for i in range(3):
              status = json.loads((root / f"status-{i}.json").read_text())
              heights.append(int(status["result"]["sync_info"]["latest_block_height"]))
              commit = json.loads((root / f"commit-{i}.json").read_text())
              hashes.append(commit["result"]["signed_header"]["header"]["app_hash"])
          if len(set(hashes)) != 1:
              raise SystemExit(f"validator application hashes diverged at height 2: {hashes}")
          print(f"Three validators agree at height 2; app_hash={hashes[0]}; observed heights={heights}")
          PY

          # Restart validator 0 together with its application and adapter,
          # preserving its CometBFT home and independent SQLite database.
          kill "${PIDS[2]}" "${PIDS[1]}" "${PIDS[0]}"
          wait "${PIDS[2]}" "${PIDS[1]}" "${PIDS[0]}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/hnd-data/python-0.sock"

          hnd-abci-python --chain-db "$RUNNER_TEMP/hnd-data/ledger-0.sqlite" \
            --socket "$RUNNER_TEMP/hnd-data/python-0.sock" \
            >"$RUNNER_TEMP/hnd-data/python-0.log" 2>&1 &
          PIDS[0]=$!
          for _ in $(seq 1 30); do
            [[ -S "$RUNNER_TEMP/hnd-data/python-0.sock" ]] && break
            kill -0 "${PIDS[0]}" 2>/dev/null || { cat "$RUNNER_TEMP/hnd-data/python-0.log"; exit 1; }
            sleep 1
          done
          [[ -S "$RUNNER_TEMP/hnd-data/python-0.sock" ]]

          HND_IPC_SOCKET="$RUNNER_TEMP/hnd-data/python-0.sock" \
            HND_ABCI_LISTEN="tcp://127.0.0.1:28658" \
            "$RUNNER_TEMP/hnd-abci" >"$RUNNER_TEMP/hnd-data/adapter-0.log" 2>&1 &
          PIDS[1]=$!
          sleep 1
          kill -0 "${PIDS[1]}"

          cometbft start --home "$ROOT/node0" >"$RUNNER_TEMP/hnd-data/node-0.log" 2>&1 &
          PIDS[2]=$!

          recovered=false
          for _ in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:26657/status -o "$RUNNER_TEMP/status-0-restarted.json"; then
              height=$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["result"]["sync_info"]["latest_block_height"]))' "$RUNNER_TEMP/status-0-restarted.json")
              if [[ "$height" -ge 3 ]]; then
                recovered=true
                echo "Validator 0 recovered from persistent application and node data at height $height"
                break
              fi
            fi
            kill -0 "${PIDS[2]}" 2>/dev/null || { cat "$RUNNER_TEMP/hnd-data/python-0.log" "$RUNNER_TEMP/hnd-data/adapter-0.log" "$RUNNER_TEMP/hnd-data/node-0.log"; exit 1; }
            sleep 1
          done
          [[ "$recovered" == true ]] || { echo "Validator 0 did not recover"; cat "$RUNNER_TEMP/hnd-data/python-0.log" "$RUNNER_TEMP/hnd-data/adapter-0.log" "$RUNNER_TEMP/hnd-data/node-0.log"; exit 1; }

          for i in 0 1 2; do
            curl --silent --fail "http://127.0.0.1:$((26657+i))/commit?height=2" -o "$RUNNER_TEMP/commit-restarted-$i.json"
          done
          python - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          hashes = [
              json.loads((root / f"commit-restarted-{i}.json").read_text())
                  ["result"]["signed_header"]["header"]["app_hash"]
              for i in range(3)
          ]
          if len(set(hashes)) != 1:
              raise SystemExit(f"application hash diverged after validator restart: {hashes}")
          print(f"Validator restart recovery verified; all three app_hash values still match: {hashes[0]}")
          PY
